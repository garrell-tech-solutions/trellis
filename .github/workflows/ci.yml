name: CI

# Every check here is one of the canonical commands from
# swarmforge/constitution/articles/stack.prompt, or an existing executable
# script under scripts/. Nothing is reimplemented in YAML: the scripts stay the
# single authoritative definition of what they assert. In particular no
# threshold, baseline percentage or format list appears in this file -- the
# analyzers own those, so changing one is a change to the analyzer and shows up
# in its diff rather than here.
#
# Two build jobs, split by how long they take rather than by what they check:
#
#   gate     fmt, clippy, unit tests, the purity gate, the musl release build.
#            Fast feedback. Unchanged by issue #26.
#   quality  the Gherkin acceptance suite and the analyzers. Slower, needs
#            babashka and the APS tooling, and cannot start reporting honest
#            numbers until the acceptance entrypoints exist. Added by #26.
#
# They run in parallel and neither waits on the other, so a formatting mistake
# still reports in about a minute.

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

permissions:
  contents: read

# Superseding a run is right on a branch and wrong on trunk. On a PR only the
# tip matters: an older commit's result is about code the author has already
# replaced, so cancelling it saves a runner and loses nothing.
#
# Every commit on trunk is a state someone may ship, bisect or roll back to,
# and it is the only opportunity to learn whether that state builds. Cancelling
# there does not defer the verdict, it discards it -- and because a superseded
# run reports as "cancelled" rather than "failed", the gap does not look like a
# gap. That happened to 5a3247e (run 31835546542): the merge of PR #53 was
# killed 31 seconds in by the next push and has never been built on trunk.
#
# So: supersede everywhere except trunk, where runs are left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # decisions.md T-migrations-append-only / issue #32: migrations are
  # append-only, because sqlx
  # checksums every applied migration and an edited one makes existing
  # databases refuse to boot.
  #
  # Its own job, not a step in `gate`, for three reasons: it needs
  # a full-history checkout that the build job has no use for; it answers in
  # seconds and should not queue behind a ~10 minute Rust build to tell you
  # your migration edit is unmergeable; and it is the one check here whose
  # trigger differs from the rest.
  #
  # pull_request only. On push to trunk HEAD *is* origin/trunk, so
  # `origin/trunk...HEAD` is empty by construction -- the check could never
  # fail there, and a step that always passes reads as coverage it does not
  # provide. It is also the wrong moment: by the time a commit is on trunk the
  # edited migration is already published and the damage is done. The gate
  # belongs before the merge, which is exactly where pull_request runs it.
  # GitHub reports the job as skipped on push, not as a pass.
  migration-immutability:
    name: migrations are append-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      # fetch-depth: 0 is load-bearing. The default shallow, single-branch
      # clone has neither origin/trunk nor a merge-base, and the diff below
      # would be meaningless rather than merely wrong.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # checkout leaves the PR merge commit at HEAD but does not guarantee a
      # remote-tracking ref for the base branch, so fetch it explicitly. Via
      # env rather than inline ${{ }} so the branch name is never interpolated
      # into the shell.
      - name: Fetch the base branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --prune origin \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

      - name: Migrations already on the base branch are immutable
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: ./scripts/ci/migration_immutability.sh "origin/$BASE_BRANCH"

  # docs/decisions.md keys every settled decision by a content-derived slug,
  # and source comments cite those slugs. This job fails the build if a
  # citation names a decision the log does not contain.
  #
  # It is here rather than in `gate` for the same reasons the job above is:
  # it needs no Rust toolchain, and a broken citation should be reported in
  # seconds rather than after a ~10 minute build. Unlike that job it runs on
  # push as well as pull_request -- it asserts a property of the tree, not of
  # a diff, so it is meaningful on trunk and would catch a slug orphaned by a
  # later edit to the decisions log itself.
  decision-slugs:
    name: decision citations resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The default shallow checkout is enough: this reads the working tree,
      # not the history.
      - uses: actions/checkout@v5

      - name: Every cited decision slug exists in docs/decisions.md
        run: ./scripts/ci/decision_slugs.sh

  gate:
    name: fmt, clippy, test, T4 purity, musl release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # libsqlite3-sys compiles C against the musl target, so the release
      # build needs a musl C toolchain. The cc crate picks up musl-gcc for
      # x86_64-unknown-linux-musl automatically once musl-tools is present.
      #
      # The package is not the problem and never was. Fetching musl,
      # musl-dev and musl-tools is about a megabyte and takes ~8s on a
      # healthy runner (run 32084039789, 00:19:17 -> 00:19:25), and none of
      # the three is preinstalled, so the step is doing necessary work.
      #
      # What hangs is `apt-get update`. Runs 32084286223 and 32088198294 both
      # stalled fetching release indexes -- azure.archive.ubuntu.com stopped
      # answering, apt fell back to archive.ubuntu.com and went quiet
      # mid-fetch -- and neither reached the install line at all. Left to its
      # defaults apt has no overall deadline, so the step held the job until
      # something outside it intervened: the first burned the 30-minute job
      # timeout, the second was killed by hand at 24 minutes.
      #
      # Three layers, because each catches what the next cannot:
      #
      #   Acquire::*   caps a single connection, so one dead mirror is
      #                skipped rather than waited on.
      #   timeout 90   caps one apt invocation, which is what actually failed
      #                here: apt was not erroring, it was sitting there.
      #   retry x3     a stalled mirror is transient, and re-running the job
      #                by hand is the same fix a machine can do unattended.
      #
      # timeout-minutes is the backstop for all three (worst case is ~9.5
      # minutes of attempts and backoff), so this can no longer cost a job
      # its whole budget however it fails.
      - name: Install musl C toolchain
        timeout-minutes: 10
        run: |
          apt_try() {
            timeout 90 sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              "$@"
          }
          for attempt in 1 2 3; do
            if apt_try update \
              && apt_try install -y --no-install-recommends musl-tools; then
              musl-gcc --version | head -1
              exit 0
            fi
            echo "::warning::apt attempt $attempt did not complete; retrying"
            # A timed-out install can leave dpkg mid-transaction, which would
            # fail the next attempt for a different reason than the one being
            # retried. Cheap to run and a no-op when nothing is pending.
            sudo dpkg --configure -a || true
            sleep $(( attempt * 10 ))
          done
          echo "::error::musl C toolchain install failed after 3 attempts"
          exit 1

      # No toolchain action: `rustup toolchain install` with no toolchain
      # argument installs exactly the toolchain rust-toolchain.toml pins,
      # rather than overriding the pin with a RUSTUP_TOOLCHAIN of its own.
      # The clippy/rustfmt components and the musl target are declared in that
      # file too (T-toolchain-pinned), so this one command brings all three.
      #
      # The explicit adds below are kept as a safety net, not as the source of
      # truth. When the pinned toolchain is already present, `rustup toolchain
      # install` can short-circuit with "using existing install"; `rustup
      # {component,target} add` is idempotent and applies to the active
      # (pinned) toolchain, so it closes that gap either way. Since the pin is
      # an exact version, the runner's preinstalled stable is usually the wrong
      # version and gets downloaded rather than reused. Measured at ~12s on
      # ubuntu-latest (six components) on the run that introduced this pin --
      # cheap, and the cost of CI and a developer checkout agreeing. Expect it
      # to grow the further the pin drifts from the runner image's stable.
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustup component add clippy rustfmt
          rustup target add x86_64-unknown-linux-musl
          rustup show active-toolchain
          cargo --version
          rustc --version

      # A pin nothing checks is a comment -- same reasoning as
      # scripts/ci/migration_immutability.sh and scripts/ci/decision_slugs.sh.
      # If an override (RUSTUP_TOOLCHAIN, a stray toolchain argument, a runner
      # image quirk) ever silently wins over rust-toolchain.toml, every job
      # below would compile on an unpinned toolchain and nothing would say so.
      - name: Verify the active toolchain is the pinned one
        run: |
          PINNED="$(grep -E '^[[:space:]]*channel' rust-toolchain.toml \
            | sed -E 's/.*"(.*)".*/\1/')"
          echo "rust-toolchain.toml pins: $PINNED"
          if ! rustc --version | grep -qF "rustc $PINNED "; then
            echo "FAIL: active rustc is not the pinned toolchain." >&2
            echo "      pinned:  $PINNED" >&2
            echo "      active:  $(rustc --version)" >&2
            exit 1
          fi

      # Fail loudly and early if the musl std is missing, rather than 400
      # crates later with a confusing "can't find crate for `core`".
      - name: Verify the musl target is installed
        run: |
          rustup target list --installed
          rustup target list --installed | grep -qx x86_64-unknown-linux-musl

      # Caches the cargo registry and target/ only. The purity gate below
      # (T-core-no-tokio) resolves from Cargo.toml and Cargo.lock via
      # `cargo tree`, so no cached
      # build artifact can make it pass when it should fail.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Unit tests only, and that is not a shortcoming of this step -- it is
      # what `cargo test --workspace` means in a fresh clone. The generated
      # acceptance entrypoints are gitignored (.gitignore:29, correctly: the
      # .feature file is the source of truth), so Cargo discovers no
      # integration test binaries here and prints `ok` for a strict subset of
      # what a reader assumes it ran. The Gherkin suite is gated in `quality`
      # below, which generates the entrypoints first. Issue #26.
      - name: Test
        run: cargo test --workspace

      # decisions.md T-core-no-tokio / issue #8 acceptance criterion 3:
      # scheduler-core must not depend on tokio or sqlx. Release gate for
      # every milestone from M0 onward. Runs even when an earlier step failed,
      # so a red test suite can never mask a purity regression.
      - name: Purity release gate -- scheduler-core depends on no runtime
        if: ${{ !cancelled() }}
        run: ./scripts/qa/scheduler_core_purity.sh

      # issue #101 / qa/phone_layout.md. The only check in this repo that can
      # observe a computed style, a scroll height or a rendered box: it drives
      # a real headless Chrome at a 390x844 phone viewport against a running
      # server and asserts geometry. Every other gate in this workflow, and
      # every Gherkin scenario in `quality`, asserts over HTTP against markup,
      # and none of them could see the bug this closes -- it shipped in #92,
      # #94 and #96, was named in all three pull-request bodies, and CI was
      # green through every one of them.
      #
      # In `gate` rather than a job of its own, following the two
      # scripts/qa/*.sh this job already invokes by name. The script builds
      # the debug binary, which this job has already built and cached, and the
      # browser work itself is seconds; a separate job would pay for a second
      # checkout, a second rustup install and a second cargo build to run one
      # script.
      #
      # The three setup steps below exist so the dependency is declared rather
      # than hoped for. The script itself fails closed when node or
      # playwright-core is missing -- its own header says so -- and this
      # wiring must not undo that: no continue-on-error, no `if:`, nothing
      # that turns an absent browser into a silent pass. A check that skips
      # when its own dependency is missing reproduces the exact blind spot it
      # exists to close, one layer down.
      - name: Node for the phone-layout browser check
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Globally, not into the checkout: scripts/qa/phone_layout.sh resolves
      # the module through `npm root -g` and this repo has no package.json to
      # install into. playwright-core rather than playwright on purpose -- it
      # is the driver without the browser bundle it would otherwise download,
      # and the step below points it at the runner's own Chrome instead.
      - name: Install playwright-core
        run: |
          npm install -g playwright-core
          node -e "console.log('playwright-core', require('playwright-core/package.json').version)"

      # ubuntu-latest is widely believed to preinstall Google Chrome. This
      # step does not take that on faith: it resolves an actual binary and
      # fails the job with a readable error if it finds none, rather than
      # letting the check die inside playwright with a launch failure about a
      # path nobody chose. The result is exported as PHONE_LAYOUT_CHROME,
      # which is the override scripts/qa/phone_layout.cjs already reads (its
      # default is a bare /usr/bin/google-chrome).
      - name: Locate Chrome for the phone-layout check
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if chrome_path="$(command -v "$candidate")"; then
              echo "PHONE_LAYOUT_CHROME=$chrome_path" >> "$GITHUB_ENV"
              echo "using $candidate at $chrome_path"
              "$chrome_path" --version \
                || echo "::warning::$candidate did not report a version"
              exit 0
            fi
          done
          echo "::error::no Chrome or Chromium binary on PATH -- the phone-layout check cannot run, and it is not allowed to skip"
          exit 1

      - name: Phone layout (real browser, 390x844)
        run: ./scripts/qa/phone_layout.sh

      # Runs `cargo build --release --target x86_64-unknown-linux-musl` and
      # then asserts via ldd that the produced binary is actually static --
      # a release build that exits 0 but links dynamically is not a pass.
      - name: Release build (musl, static)
        run: ./scripts/qa/release_binary.sh

      # issue #98: ops/update.sh installs Trellis on jtg-tower from this
      # artifact, never by compiling locally. The build two steps up already
      # produces exactly the binary that host runs and already asserts it is
      # static -- this step's only job is to keep the artifact instead of
      # letting the runner discard it, so what gets installed is
      # byte-identical to what this gate proved green.
      #
      # Two conditions, not one, since issue #102 widened this from "trunk
      # only":
      #
      #   push to trunk    unchanged from #98. ops/update.sh's whole premise
      #                     is that "green on trunk" means safe to run on the
      #                     one real host this project's live instance runs
      #                     on, and that premise still needs push+trunk
      #                     specifically -- a PR run's `github.ref` is a
      #                     merge ref, not trunk, so this arm alone was
      #                     always trunk-exclusive by construction.
      #
      #   pull_request      new for #102. ops/preview.sh fetches a branch's
      #                     own most recent successful run so a branch can be
      #                     looked at on the phone before it merges, and
      #                     ci.yml's push trigger only fires for `trunk` (see
      #                     the `on:` block above) -- a feature branch is
      #                     built at all only via its pull_request run, so
      #                     that is the one this arm has to allow. The
      #                     artifact this uploads is still just the build two
      #                     steps up, still proven static, still never
      #                     installed anywhere but the SEPARATE preview unit
      #                     ops/preview.sh manages -- it never reaches
      #                     trellis.service, which only ever runs what
      #                     ops/update.sh fetched from trunk.
      - name: Upload release binary
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/trunk') || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: trellis-linux-musl
          path: target/x86_64-unknown-linux-musl/release/trellis
          if-no-files-found: error
          retention-days: 90

  # The Gherkin acceptance suite and the analyzers (issue #26). Until this job
  # existed, CI enforced none of the thresholds
  # swarmforge/constitution/articles/stack.prompt declares, and the acceptance
  # suite -- the specifier's entire output -- ran only when a human or an agent
  # remembered to invoke it in a worktree that had already generated the
  # entrypoints.
  #
  # Its own job rather than more steps on `gate`, because it needs babashka,
  # the APS pipeline, jscpd and two cargo-installed analyzers that `gate` has
  # no use for, and because roughly twenty minutes of analyzers hanging off the
  # fast gate would stop it being fast. The toolchain preamble is duplicated
  # from `gate` deliberately and is the whole overlap: extracting fifteen lines
  # of rustup into a composite action would put this workflow's setup in a file
  # the workflow does not show you, to save less than it costs to look for.
  quality:
    name: acceptance suite + analyzers
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # features/release_binary.feature is one of the eleven, and its step
      # handler runs the musl release build, so this job needs the same musl C
      # toolchain `gate` does. libsqlite3-sys compiles C against the target.
      #
      # The package is not the problem and never was. Fetching musl,
      # musl-dev and musl-tools is about a megabyte and takes ~8s on a
      # healthy runner (run 32084039789, 00:19:17 -> 00:19:25), and none of
      # the three is preinstalled, so the step is doing necessary work.
      #
      # What hangs is `apt-get update`. Runs 32084286223 and 32088198294 both
      # stalled fetching release indexes -- azure.archive.ubuntu.com stopped
      # answering, apt fell back to archive.ubuntu.com and went quiet
      # mid-fetch -- and neither reached the install line at all. Left to its
      # defaults apt has no overall deadline, so the step held the job until
      # something outside it intervened: the first burned the 30-minute job
      # timeout, the second was killed by hand at 24 minutes.
      #
      # Three layers, because each catches what the next cannot:
      #
      #   Acquire::*   caps a single connection, so one dead mirror is
      #                skipped rather than waited on.
      #   timeout 90   caps one apt invocation, which is what actually failed
      #                here: apt was not erroring, it was sitting there.
      #   retry x3     a stalled mirror is transient, and re-running the job
      #                by hand is the same fix a machine can do unattended.
      #
      # timeout-minutes is the backstop for all three (worst case is ~9.5
      # minutes of attempts and backoff), so this can no longer cost a job
      # its whole budget however it fails.
      - name: Install musl C toolchain
        timeout-minutes: 10
        run: |
          apt_try() {
            timeout 90 sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              "$@"
          }
          for attempt in 1 2 3; do
            if apt_try update \
              && apt_try install -y --no-install-recommends musl-tools; then
              musl-gcc --version | head -1
              exit 0
            fi
            echo "::warning::apt attempt $attempt did not complete; retrying"
            # A timed-out install can leave dpkg mid-transaction, which would
            # fail the next attempt for a different reason than the one being
            # retried. Cheap to run and a no-op when nothing is pending.
            sudo dpkg --configure -a || true
            sleep $(( attempt * 10 ))
          done
          echo "::error::musl C toolchain install failed after 3 attempts"
          exit 1

      # See the equivalent step in `gate` for why there is no toolchain action:
      # a bare `rustup toolchain install` honours rust-toolchain.toml's pin
      # instead of overriding it (T-toolchain-pinned).
      #
      # llvm-tools-preview is added here rather than in rust-toolchain.toml on
      # purpose. stack.prompt lists it as part of the coverage tool's install
      # line, not as part of the toolchain; nothing outside this job needs it,
      # and a fresh clone should not pay to download it in order to run
      # `cargo build`.
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustup component add clippy rustfmt llvm-tools-preview
          rustup target add x86_64-unknown-linux-musl
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # Babashka. engineering.prompt: "Prefer the Babashka APS tools ... Use
      # Go-based APS tools only if the Babashka APS tools do not work in the
      # current project environment." The Babashka ones work, so this is the
      # supported path and the Go tools are never installed.
      #
      # scripts/acceptance/generate.bb also shells out to `rustfmt`, so that
      # the generated entrypoints satisfy `cargo fmt --all -- --check` like
      # hand-written source. That component is installed above.
      #
      # Downloaded into RUNNER_TEMP rather than the checkout for the same
      # reason APS_HOME points outside it: nothing that is not this project's
      # source belongs in a tree four analyzers are about to walk.
      - name: Install babashka
        run: |
          curl -sSL https://raw.githubusercontent.com/babashka/babashka/master/install \
            -o "$RUNNER_TEMP/install-babashka"
          chmod +x "$RUNNER_TEMP/install-babashka"
          sudo "$RUNNER_TEMP/install-babashka"
          bb --version

      # The APS pipeline is installed out of tree, not vendored -- the same
      # arrangement scripts/acceptance/lib.sh describes and the same command it
      # prints when the pipeline is missing. Its bb.edn declares only :paths
      # and :tasks, no external deps, so a shallow clone is the whole install
      # and nothing is fetched at run time.
      #
      # RUNNER_TEMP, not the checkout: the APS pipeline is a second source
      # tree, and a second source tree inside the checkout is precisely what
      # issue #26's third trap is about. Every analyzer below walks the
      # workspace; putting APS in it would have them measuring somebody else's
      # repository and reporting the total as this project's.
      #
      # APS_HOME is exported through GITHUB_ENV rather than declared in a
      # job-level `env:` block, because the value depends on RUNNER_TEMP and
      # the `runner` context does not exist at job level -- referencing it
      # there fails the whole workflow before a single job is created, with no
      # job log to say why. scripts/acceptance/lib.sh reads APS_HOME and falls
      # back to ~/.cache/swarmforge/aps-pipeline; setting it here keeps the
      # clone target and the consumer from drifting apart.
      - name: Install the APS pipeline
        run: |
          echo "APS_HOME=$RUNNER_TEMP/aps-pipeline" >> "$GITHUB_ENV"
          git clone --depth 1 \
            https://github.com/unclebob/Acceptance-Pipeline-Specification.git \
            "$RUNNER_TEMP/aps-pipeline"
          test -f "$RUNNER_TEMP/aps-pipeline/bb.edn"

      - name: Install jscpd
        run: |
          npm install -g jscpd
          jscpd --version

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # No prebuilt binary for this one, so it is a from-source build the first
      # time. Swatinem/rust-cache above caches ~/.cargo/bin, so subsequent runs
      # restore it.
      #
      # --locked is load-bearing, not hygiene. Without it this install fails
      # outright on the pinned toolchain: rust-code-analysis 0.0.25 pins
      # tree-sitter 0.20, its tree-sitter-<language> grammar crates take a
      # caret range, and newer grammars published since that release pull in
      # tree-sitter 0.26. Two versions of the crate land in one dependency
      # graph and the build dies on
      #
      #   error[E0308]: expected `tree_sitter::Language`, found a different
      #                 `tree_sitter::Language`
      #
      # which reads like a compiler bug and is really a resolver outcome that
      # depends on what was published this week. --locked uses the Cargo.lock
      # published with the crate, so the grammar versions are the ones the
      # release was built against. Verified on rustc 1.97.1: fails without it,
      # builds in 14s with it, and the binary reports identical metrics.
      - name: Install rust-code-analysis-cli
        run: |
          if ! command -v rust-code-analysis-cli >/dev/null; then
            cargo install rust-code-analysis-cli --locked
          fi
          rust-code-analysis-cli --version

      # ---------------------------------------------------------------------
      # ORDER BELOW IS LOAD-BEARING. DO NOT REORDER.
      #
      # coverage.sh and crap.sh must run AFTER scripts/acceptance/run.sh.
      # The step handlers under crates/acceptance-tests/src/steps/ are ordinary
      # library code, and the only thing that executes them is a generated
      # entrypoint. Run the analyzers first and every handler reads as dead
      # code. Measured both ways on 2026-08-14 by moving the generated
      # entrypoints aside and re-running: coverage 96.41% -> 86.80% with ten
      # files under the 80% threshold, and CRAP 0 violations -> 5, topping out
      # at 72.0. Every one of those fifteen is an artefact of the ordering
      # rather than a fact about the tree.
      #
      # The failure that produces is the worse kind: plausible numbers. Nothing
      # errors, the JSON is well formed, and the only tell is that the figures
      # are wrong. Whoever reorders these steps will be looking at a coverage
      # regression that did not happen.
      # ---------------------------------------------------------------------

      - name: Acceptance suite (Gherkin, 11 features)
        id: acceptance
        run: ./scripts/acceptance/run.sh

      # The cheap guard, and the one that closes the silence. run.sh ends in
      # `cargo test -p acceptance-tests`; if generation produced nothing that
      # command finds nothing, passes, and run.sh exits 0 having asserted
      # nothing at all. This compares the generated entrypoints against
      # features/*.feature by name.
      #
      # !cancelled() so it reports even when the step above failed: if run.sh
      # broke partway, what generation managed to produce is exactly the
      # diagnostic worth having.
      - name: Every feature generated an entrypoint
        if: ${{ !cancelled() }}
        run: ./scripts/ci/acceptance_entrypoints.sh

      # Coverage and CRAP are gated on the acceptance run having SUCCEEDED,
      # not merely on the job not being cancelled -- see the ordering note
      # above. A number measured without the entrypoints is not a smaller
      # truth, it is a different and wrong one, and printing it would invite
      # someone to act on it.
      - name: Coverage (threshold owned by scripts/analyzers/coverage.sh)
        if: ${{ !cancelled() && steps.acceptance.outcome == 'success' }}
        run: ./scripts/analyzers/coverage.sh .

      - name: CRAP (threshold owned by scripts/analyzers/crap.sh)
        if: ${{ !cancelled() && steps.acceptance.outcome == 'success' }}
        run: ./scripts/analyzers/crap.sh .

      # Complexity and DRY read source, not test results, so they are
      # independent of the acceptance run and still report when it fails.
      #
      # Complexity goes through scripts/ci/complexity_baseline.sh rather than
      # calling the analyzer directly. The analyzer is legitimately red -- five
      # step dispatchers that T-complexity-8 and the 2026-08-12 decisions log
      # entry both refuse to flatten -- so gating on its exit code would mean a
      # permanently red build, which is a red X reviewers learn to ignore. The
      # gate pins the accepted set instead and fails when it grows, moves or
      # goes stale. The threshold is untouched and still lives in
      # swarmforge/constitution/articles/stack.prompt.
      - name: Complexity against the accepted baseline
        if: ${{ !cancelled() }}
        run: ./scripts/ci/complexity_baseline.sh .

      # Invoked, not reimplemented: no threshold, no baseline percentage and no
      # format list appears here. #50 changed what dry.sh measures -- it now
      # restricts to rust,bash rather than scanning prose -- while this branch
      # was in flight, and a number or a format set copied into the workflow
      # would have gone stale on that merge without anything saying so.
      - name: DRY (threshold owned by scripts/analyzers/dry.sh)
        if: ${{ !cancelled() }}
        run: ./scripts/analyzers/dry.sh .
