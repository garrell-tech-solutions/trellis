[package]
name = "acceptance-tests"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "acceptance_tests"
path = "src/lib.rs"

[dependencies]
axum = "0.8.9"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "migrate"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "process"] }
tower = { version = "0.5.3", features = ["util"] }
trellis-server = { version = "0.1.0", path = "../trellis-server" }
