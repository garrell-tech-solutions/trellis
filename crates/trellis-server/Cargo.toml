[package]
name = "trellis-server"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "trellis"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
