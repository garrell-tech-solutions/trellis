<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>{% block title %}Trellis{% endblock %}</title>
<link rel="stylesheet" href="/static/trellis.css">
<script src="/static/htmx.min.js"></script>
<script type="text/javascript">
/* htmx swaps the target only on 2xx by default; a validation rejection is a
   deliberate 422 whose body is the re-rendered fragment it failed against,
   so it needs to be swapped in too -- product-wide, on every page
   (T-forms-swap-one-fragment: 422 means exactly one thing here). */
htmx.config.responseHandling.unshift({code: "422", swap: true});
</script>
</head>
<body>
<header>
<nav>
<ul>
{% for link in nav %}
<li><a href="{{ link.path }}"{% if link.current %} aria-current="page"{% endif %}>{{ link.label }}</a></li>
{% endfor %}
</ul>
</nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
