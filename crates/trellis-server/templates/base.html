<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<!-- #112: theme_color is a literal value in manifest.webmanifest too --
     colours cannot be CSS custom properties in either place, so this and
     the manifest's theme_color are kept in sync by hand until a slice
     reworks both for the palette in flight (provisional, see the
     installable pull request). -->
<meta name="theme-color" content="#0f4e0f">
<link rel="manifest" href="/manifest.webmanifest">
<title>{% block title %}Trellis{% endblock %}</title>
<link rel="stylesheet" href="/static/trellis.css">
<script src="/static/htmx.min.js"></script>
<script type="text/javascript">
/* htmx swaps the target only on 2xx by default; a validation rejection is a
   deliberate 422 whose body is the re-rendered fragment it failed against,
   so it needs to be swapped in too -- product-wide, on every page
   (T-forms-swap-one-fragment: 422 means exactly one thing here). */
htmx.config.responseHandling.unshift({code: "422", swap: true});
</script>
</head>
<body>
<header>
<nav>
<ul>
{% for link in nav %}
<li><a href="{{ link.path }}"{% if link.current %} aria-current="page"{% endif %}>{{ link.label }}</a></li>
{% endfor %}
</ul>
</nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
