<li id="capture-row-{{ capture.id }}" class="row">
<div class="row-text">{{ capture.text }}{% if let Some(tag) = capture.context_tag %} {{ tag }}{% endif %}</div>
<div class="kinds">
<form class="kind kind-wide" hx-post="/captures/{{ capture.id }}/triage" hx-target="#lists" hx-swap="outerHTML">
<input type="hidden" name="kind" value="pool">
<label>Tag <input type="text" name="context_tag" list="context-tag-suggestions" placeholder="@homedepot"></label>
<button type="submit">Pool</button>
</form>
<details class="kind">
<summary>Committed</summary>
<details class="commitment-choice">
<summary>At a time</summary>
<form class="fields" hx-post="/captures/{{ capture.id }}/triage" hx-target="#lists" hx-swap="outerHTML">
<input type="hidden" name="kind" value="committed">
<input type="hidden" name="commitment" value="at">
<label>Day <input type="date" name="deadline_date"></label>
<label>Time <input type="time" name="deadline_time"></label>
<label>Priority
<select name="priority">
<option value="P1">P1</option>
<option value="P2">P2</option>
<option value="P3">P3</option>
<option value="P4">P4</option>
</select>
</label>
<label>Estimate (minutes) <input type="number" name="estimated_minutes" placeholder="180"></label>
<label>Tag <input type="text" name="context_tag" list="context-tag-suggestions" placeholder="@homedepot"></label>
<div class="actions"><button type="submit">Add</button></div>
</form>
</details>
<details class="commitment-choice">
<summary>By a day</summary>
<form class="fields" hx-post="/captures/{{ capture.id }}/triage" hx-target="#lists" hx-swap="outerHTML">
<input type="hidden" name="kind" value="committed">
<input type="hidden" name="commitment" value="by">
<label>Day <input type="date" name="deadline_date"></label>
<label>Priority
<select name="priority">
<option value="P1">P1</option>
<option value="P2">P2</option>
<option value="P3">P3</option>
<option value="P4">P4</option>
</select>
</label>
<label>Estimate (minutes) <input type="number" name="estimated_minutes" placeholder="180"></label>
<label>Tag <input type="text" name="context_tag" list="context-tag-suggestions" placeholder="@homedepot"></label>
<div class="actions"><button type="submit">Add</button></div>
</form>
</details>
</details>
<details class="kind">
<summary>Quota</summary>
<form class="fields" hx-post="/captures/{{ capture.id }}/triage" hx-target="#lists" hx-swap="outerHTML">
<input type="hidden" name="kind" value="quota">
<label>Sessions <input type="number" name="target_count" placeholder="3"></label>
<label>Minutes each <input type="number" name="target_minutes_each" placeholder="45"></label>
<label>Per
<select name="period">
<option value="week">week</option>
<option value="month">month</option>
</select>
</label>
<label>Tag <input type="text" name="context_tag" list="context-tag-suggestions" placeholder="@homedepot"></label>
<div class="actions"><button type="submit">Add</button></div>
</form>
</details>
</div>
<form class="dismiss" hx-post="/captures/{{ capture.id }}/dismiss" hx-target="#lists" hx-swap="outerHTML">
<button type="submit">Dismiss</button>
</form>
{% if let Some(message) = capture.error %}
<p class="triage-error">{{ message }}</p>
{% endif %}
</li>
