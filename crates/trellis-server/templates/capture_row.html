<li id="capture-row-{{ capture.id }}">
{{ capture.text }}
<form style="display:inline" hx-post="/captures/{{ capture.id }}/triage" hx-vals='{"kind":"pool"}' hx-target="#lists" hx-swap="outerHTML">
<button type="submit">Pool</button>
</form>
<details style="display:inline-block">
<summary>Committed</summary>
<form hx-post="/captures/{{ capture.id }}/triage" hx-target="#lists" hx-swap="outerHTML">
<input type="hidden" name="kind" value="committed">
<label>Deadline <input type="text" name="deadline" placeholder="2026-08-20T17:00:00Z"></label>
<label>Type
<select name="deadline_type">
<option value="hard">hard</option>
<option value="soft">soft</option>
</select>
</label>
<label>Priority
<select name="priority">
<option value="P1">P1</option>
<option value="P2">P2</option>
<option value="P3">P3</option>
<option value="P4">P4</option>
</select>
</label>
<button type="submit">Add</button>
</form>
</details>
<details style="display:inline-block">
<summary>Quota</summary>
<form hx-post="/captures/{{ capture.id }}/triage" hx-target="#lists" hx-swap="outerHTML">
<input type="hidden" name="kind" value="quota">
<label>Sessions <input type="number" name="target_count" placeholder="3"></label>
<label>Minutes each <input type="number" name="target_minutes_each" placeholder="45"></label>
<label>Per
<select name="period">
<option value="week">week</option>
<option value="month">month</option>
</select>
</label>
<button type="submit">Add</button>
</form>
</details>
{% if let Some(message) = capture.error %}
<p class="triage-error">{{ message }}</p>
{% endif %}
</li>
