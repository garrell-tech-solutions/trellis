{% extends "base.html" %}
{% block content %}
<h1>Trellis</h1>
<form hx-post="/captures" hx-target="#captures" hx-swap="afterbegin" hx-on::after-request="this.reset()">
<input type="text" name="raw_text" placeholder="Quick add a capture" required>
<input type="text" name="context_tag" list="context-tag-suggestions" placeholder="@homedepot">
<input type="hidden" name="source" value="web">
<button type="submit">Add</button>
</form>
{% include "lists.html" %}
{% endblock %}
