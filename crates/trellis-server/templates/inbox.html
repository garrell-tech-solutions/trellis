<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trellis</title>
<script src="/static/htmx.min.js"></script>
<script type="text/javascript">
/* htmx swaps the target only on 2xx by default; a triage rejection is a
   deliberate 422 whose body is the same #lists fragment (with a per-row
   rejection message attached), so it needs to be swapped in too. */
htmx.config.responseHandling.unshift({code: "422", swap: true});
</script>
</head>
<body>
<h1>Trellis</h1>
<form hx-post="/captures" hx-target="#captures" hx-swap="afterbegin" hx-on::after-request="this.reset()">
<input type="text" name="raw_text" placeholder="Quick add a capture" required>
<input type="hidden" name="source" value="web">
<button type="submit">Add</button>
</form>
{% include "lists.html" %}
</body>
</html>
