# Format: window <role> <agent> <worktree> [task|batch]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
#
# The specifier is the pipeline's entry role. The PM sits outside the
# implementation pipeline but inside the swarm's notification channel: the
# specifier notifies it when a slice reaches a pull request, and it hands the
# next slice back to the specifier once the user has signed off. Both use the
# main checkout; they are never active at the same time, because the PM works
# between pipeline runs and the specifier works during them.
window specifier claude specifier
window coder claude coder
window cleaner claude cleaner
window architect claude architect
window hardener claude hardener batch
window QA claude QA
window PM claude master
